name: Paket veröffentlichen

# Baut das Paket aus einem Tag und lädt genau diese eine Datei neben die Website.
# curl statt FTP-Deploy-Action: ohne State-Datei gibt es nichts, was Dateien der Seite löschen könnte.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paket:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bauen
        run: bash dev/package.sh

      - name: Name zum Tag prüfen
        run: |
          datei=$(basename release/terma-*.pkg.tar.zst)
          case "$datei" in
            "terma-${GITHUB_REF_NAME#v}-"*-x86_64.pkg.tar.zst) echo "DATEI=$datei" >> "$GITHUB_ENV" ;;
            *) echo "$datei passt nicht zu $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac

      - name: Nicht überschreiben
        run: |
          if curl --head --silent --fail --output /dev/null "https://terma.vajra-team.eu/$DATEI"; then
            echo "$DATEI liegt schon auf der Website. Für einen neuen Bau pkgrel erhöhen." >&2
            exit 1
          fi

      - name: Hochladen
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --fail --silent --show-error --ssl-reqd --retry 3 --retry-all-errors \
            --user "$FTP_USER:$FTP_PASSWORD" \
            --upload-file "release/$DATEI" "ftp://$FTP_HOST/terma.vajra-team.eu/$DATEI"

      - name: Download prüfen
        run: |
          erwartet=$(sha256sum "release/$DATEI" | cut -d' ' -f1)
          echo "$erwartet  $DATEI"
          geladen=$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors "https://terma.vajra-team.eu/$DATEI" | sha256sum | cut -d' ' -f1)
          test "$erwartet" = "$geladen"
